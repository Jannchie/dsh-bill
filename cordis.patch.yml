# dsh-bill bundle patch
#
# This file is the `dsh.bundle.patch` layer of the published npm package:
# when the plugin is installed through the official CLI —
#   dsh plugin --profile web add dsh-bill
# — the command reconciles `dsh.profile.bundles` against installed packages
# and, seeing this declaration, appends `dsh-bill` to the bundle stack.
# The profile boot then merges THIS patch (a single `insert` of the plugin
# row) exactly like a manual cordis.patch.yml mount line.
- insert:
    - id: bill
      name: 'dsh-bill'
